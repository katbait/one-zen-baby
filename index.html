<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the board use the full screen on phones with notches;
     safe-area padding in style.css keeps tiles out from under the notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choice Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The swipeable strip. board.js fills it with one .page per screen of 4 tiles. -->
  <div id="pages" aria-label="Choice pages"></div>
  <!-- One dot per screen; the current screen's dot is highlighted. -->
  <div id="dots" aria-hidden="true"></div>

  <!-- "defer" runs the script after the HTML above has loaded, so the elements exist. -->
  <script src="board.js" defer></script>
</body>
</html>
