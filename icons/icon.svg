<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- One Zen Baby app icon (original artwork): a 2x2 board with two lit tiles. -->
  <rect width="512" height="512" rx="112" fill="#1f3a5f"/>
  <!-- glow behind the two lit tiles -->
  <rect x="88" y="88" width="160" height="160" rx="40" fill="#ffd23f" opacity=".6"/>
  <rect x="264" y="264" width="160" height="160" rx="40" fill="#ffd23f" opacity=".6"/>
  <!-- tiles: top-left and bottom-right are lit -->
  <rect x="100" y="100" width="136" height="136" rx="32" fill="#ffffff" stroke="#ffd23f" stroke-width="12"/>
  <rect x="276" y="100" width="136" height="136" rx="32" fill="#fdf6e3"/>
  <rect x="100" y="276" width="136" height="136" rx="32" fill="#fdf6e3"/>
  <rect x="276" y="276" width="136" height="136" rx="32" fill="#ffffff" stroke="#ffd23f" stroke-width="12"/>
</svg>
