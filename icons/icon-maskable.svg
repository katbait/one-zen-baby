<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- "Maskable" version: Android crops icons into circles, squircles etc.,
       so the background fills the whole square and the tiles sit inside
       the middle 80% "safe zone". -->
  <rect width="512" height="512" fill="#1f3a5f"/>
  <rect x="130" y="130" width="120" height="120" rx="28" fill="#ffd23f" opacity=".6"/>
  <rect x="262" y="262" width="120" height="120" rx="28" fill="#ffd23f" opacity=".6"/>
  <rect x="140" y="140" width="100" height="100" rx="22" fill="#ffffff" stroke="#ffd23f" stroke-width="9"/>
  <rect x="272" y="140" width="100" height="100" rx="22" fill="#fdf6e3"/>
  <rect x="140" y="272" width="100" height="100" rx="22" fill="#fdf6e3"/>
  <rect x="272" y="272" width="100" height="100" rx="22" fill="#ffffff" stroke="#ffd23f" stroke-width="9"/>
</svg>
